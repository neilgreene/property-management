name: Build and publish images

# Publishes the three images to GitHub Container Registry so a deployment can
# pull by tag instead of building on the target host. That is what makes this
# deployable to a Swarm environment, which cannot build at all, and it keeps
# build tooling off the production host.
on:
  push:
    # This repository's default branch is a working branch, not main, so
    # building only on main meant no image was ever published for the code
    # people actually deploy.
    branches: [main, 'claude/postgres-web-access-jznei0']
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db
            context: .
            dockerfile: docker/db.Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: worker
            context: ./worker
            dockerfile: ./worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          # `latest` is pinned by branch name rather than via
          # {{is_default_branch}}, which evaluated false here and published
          # only an immutable sha- tag -- leaving nothing for a compose file
          # referencing :latest to pull. Both branches are listed so that
          # moving the default later does not silently stop publishing.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/postgres-web-access-jznei0' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
