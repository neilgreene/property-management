<!doctype html>
<meta charset="utf-8">
<title>SDI — Investment Property Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The app's own palette, not a second one. This page used to carry its
     own colours, which meant signing in changed the look of the product
     halfway through the first interaction anybody has with it. */
  :root{
    --ink:#0f1c2a; --ink2:#43586b; --mut:#7189a0; --line:#d8e3ee;
    --bg:#f0f5fa; --card:#fff; --accent:#1d6fa8; --accent2:#e4f0f9;
    --gate:#4d6785; --gatebg:#eaf1f8; --gateline:#cddced;
    --crit:#a8261d; --critbg:#fbeae8; --critline:#efc4bf;
    --shadow:0 1px 2px rgba(16,42,66,.06),0 6px 18px rgba(16,42,66,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",
       Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:var(--accent)}

  .wrap{min-height:100vh;display:grid;place-items:center;padding:32px 20px}
  /* Two panels side by side where there is room, stacked where there is
     not -- with the form FIRST in source order, so a narrow screen and a
     screen reader both reach the thing you came here to do before the
     description of it. */
  .door{display:grid;gap:26px;width:min(900px,100%);
    grid-template-columns:minmax(0,1fr)}
  /* The branding leads, at every width -- source order, no reordering. */
  /* Side by side as soon as there is room, so the picture sits to the
     LEFT of the panel rather than above it for most of the range. */
  @media (min-width:780px){
    .door{grid-template-columns:1fr 340px;align-items:center;gap:40px}
  }

  .brand{display:flex;align-items:center;gap:10px;margin:0 0 16px}
  .mark{background:var(--accent);color:#fff;font-weight:700;letter-spacing:.5px;
    padding:5px 8px;border-radius:6px;font-size:13px}
  .brandtxt{font-weight:600;font-size:15px}

  /* A picture, not a page of prose. A login screen is a door; nobody
     reads the wall beside it, and text here only delays the one thing
     the visitor came to do. */
  .art svg,.art .hero{display:block;width:100%;border-radius:14px}
  .art svg{height:auto}
  /* A fixed ratio so the panel does not jump between the drawing and a
     photograph of some other shape, and `cover` so a wide or tall one is
     cropped rather than squashed. */
  .art .hero{aspect-ratio:520/400;object-fit:cover}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:22px 22px 20px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 16px;font-size:16px;letter-spacing:-.01em}
  label{display:block;font-size:12px;font-weight:600;margin:13px 0 5px;
    letter-spacing:.2px}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
    font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;
    border-color:var(--accent);background:var(--card)}
  button{font:inherit;cursor:pointer}
  .primary{width:100%;margin-top:18px;padding:10px;border:0;border-radius:8px;
    background:var(--accent);color:#fff;font-weight:600}
  .primary:disabled{opacity:.55;cursor:default}

  /* The guest route is a real option and is presented as one -- below a
     rule, in the quieter weight, saying what it actually gets you. */
  .orwrap{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .guest{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);font-weight:600}
  .guest:hover{background:var(--accent2);border-color:var(--accent)}
  form.inline{margin:0}

  .err{margin-top:13px;padding:9px 11px;background:var(--critbg);
    border:1px solid var(--critline);border-radius:7px;color:var(--crit);
    font-size:13px;display:none}
  .err[data-shown]{display:block}

  .foot{margin:22px 0 0;color:var(--mut);font-size:11.5px}
</style>

<div class="wrap">
  <div class="door">

    <section class="art" aria-hidden="true">
      <div class="brand">
        <span class="mark">SDI</span>
        <span class="brandtxt">Investment Property Marketplace</span>
      </div>

      <!-- A PHOTOGRAPH IF THERE IS ONE, the drawing otherwise.
           Drop a file at web/public/assets/login.jpg (or .png/.webp) and it
           takes over; delete it and the drawing comes back. No build step
           and no config, because the alternative is a page that shows a
           broken image on any deployment where somebody forgot the file. -->
      <img id="hero" class="hero" alt="" hidden>

      <!-- Drawn, not photographed: an inline SVG needs no asset, no
           licence and no network round trip, stays sharp at any size, and
           takes the app's own palette. What it has to say is what the
           product is -- houses, and the numbers behind them. -->
      <svg viewBox="0 0 520 400" role="img" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e8f2fa"/>
            <stop offset="100%" stop-color="#dbe9f5"/>
          </linearGradient>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1d6fa8" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#1d6fa8" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="520" height="400" rx="16" fill="url(#sky)"/>

        <!-- the return curve, behind the street -->
        <path d="M40 250 L120 232 L200 244 L280 196 L360 168 L440 108 L480 96
                 L480 300 L40 300 Z" fill="url(#fill)"/>
        <path d="M40 250 L120 232 L200 244 L280 196 L360 168 L440 108 L480 96"
              fill="none" stroke="#1d6fa8" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="280" cy="196" r="5" fill="#fff" stroke="#1d6fa8" stroke-width="3"/>
        <circle cx="440" cy="108" r="5" fill="#fff" stroke="#1d6fa8" stroke-width="3"/>

        <!-- the street: a duplex, a single family, a small multifamily -->
        <g>
          <!-- left: single family, gable -->
          <path d="M62 300 L62 222 L112 186 L162 222 L162 300 Z" fill="#13395c"/>
          <path d="M52 226 L112 180 L172 226" fill="none" stroke="#0f2c47"
                stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="80"  y="240" width="20" height="20" rx="2" fill="#9ec6e4"/>
          <rect x="124" y="240" width="20" height="20" rx="2" fill="#9ec6e4"/>
          <rect x="100" y="272" width="24" height="28" rx="2" fill="#e4f0f9"/>

          <!-- middle: small multifamily, the tallest -->
          <rect x="196" y="160" width="120" height="140" rx="3" fill="#1d6fa8"/>
          <rect x="188" y="150" width="136" height="14" rx="3" fill="#13395c"/>
          <g fill="#cfe6f7">
            <rect x="212" y="180" width="18" height="22" rx="2"/>
            <rect x="247" y="180" width="18" height="22" rx="2"/>
            <rect x="282" y="180" width="18" height="22" rx="2"/>
            <rect x="212" y="216" width="18" height="22" rx="2"/>
            <rect x="247" y="216" width="18" height="22" rx="2"/>
            <rect x="282" y="216" width="18" height="22" rx="2"/>
          </g>
          <rect x="242" y="262" width="28" height="38" rx="2" fill="#e4f0f9"/>

          <!-- right: duplex -->
          <path d="M348 300 L348 214 L400 178 L452 214 L452 300 Z" fill="#2b7fb8"/>
          <path d="M338 218 L400 172 L462 218" fill="none" stroke="#13395c"
                stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="400" y1="214" x2="400" y2="300" stroke="#13395c" stroke-width="3"/>
          <rect x="364" y="232" width="18" height="20" rx="2" fill="#cfe6f7"/>
          <rect x="418" y="232" width="18" height="20" rx="2" fill="#cfe6f7"/>
          <rect x="366" y="270" width="20" height="30" rx="2" fill="#e4f0f9"/>
          <rect x="414" y="270" width="20" height="30" rx="2" fill="#e4f0f9"/>
        </g>

        <!-- the street itself -->
        <rect x="24" y="300" width="472" height="5" rx="2.5" fill="#13395c" opacity=".85"/>

        <!-- a sale board, which is what makes it a sales application
             rather than a picture of some houses. Planted in front of the
             street rather than under it: the post crosses the kerb line,
             which is what puts it nearer the viewer than the houses. -->
        <g>
          <rect x="444" y="284" width="7" height="40" rx="3.5" fill="#13395c"/>
          <rect x="390" y="242" width="116" height="46" rx="6" fill="#fff"
                stroke="#13395c" stroke-width="3"/>
          <rect x="404" y="256" width="64" height="7" rx="3.5" fill="#1d6fa8"/>
          <rect x="404" y="270" width="44" height="7" rx="3.5" fill="#9ec6e4"/>
        </g>
      </svg>
    </section>

    <section class="card">
      <h2>Sign in</h2>

      <form id="f" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button id="go" class="primary" type="submit">Sign in</button>
        <!-- One message for every failure. Telling the visitor which half
             was wrong turns the form into an account-enumeration tool. -->
        <p class="err" id="err" role="alert"></p>
      </form>

      <div class="orwrap">
        <!-- A form POST, not a link: it sets a cookie, and a GET is not
             supposed to change anything. A form also means this works
             with no JavaScript at all, which a link calling fetch() would
             not. -->
        <form class="inline" method="post" action="/api/guest">
          <button class="guest" type="submit">Browse as a guest</button>
        </form>
      </div>

      <p class="foot" id="buildline"></p>
    </section>

  </div>
</div>

<script>
// Try a photograph, in the formats somebody is likely to have to hand. The
// drawing is what is already on screen, so a miss costs nothing and there
// is never a broken-image icon: the <img> stays hidden until one loads.
(function () {
  const img = document.getElementById('hero');
  const svg = document.querySelector('.art svg');
  const tries = ['/assets/login.jpg', '/assets/login.png', '/assets/login.webp'];
  let i = 0;
  img.addEventListener('load', () => { img.hidden = false; if (svg) svg.remove(); });
  img.addEventListener('error', () => { if (i < tries.length) img.src = tries[i++]; });
  img.src = tries[i++];
})();

// Which build is running. Not gated -- an anonymous visitor reporting a
// problem needs to be able to say which version they were looking at.
fetch('/api/whoami').then((r) => r.json()).then((j) => {
  if (j && j.build && j.build.version) {
    document.getElementById('buildline').textContent = 'Build ' + j.build.version;
  }
}).catch(() => {});

const f = document.getElementById('f');
const err = document.getElementById('err');
const go = document.getElementById('go');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.removeAttribute('data-shown');
  go.disabled = true; go.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { window.location = '/'; return; }
    err.textContent = j.error || 'Sign in failed.';
    err.setAttribute('data-shown', '');
  } catch {
    err.textContent = 'Sign in failed.';
    err.setAttribute('data-shown', '');
  } finally {
    go.disabled = false; go.textContent = 'Sign in';
  }
});
</script>
