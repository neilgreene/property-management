<!doctype html>
<meta charset="utf-8">
<title>SDI — Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/nav.css">
<link rel="stylesheet" href="/crm.css">

<header class="bar">
  <div class="brand"><span class="mark">SDI</span> <span class="brandtxt" id="viewname">Workspace</span></div>
  <div class="who">
    <span id="whoami" class="chip">…</span>
    <a id="signin" class="ghost" href="/login.html">Sign in</a>
    <button id="signout" class="ghost" hidden></button>
  </div>
</header>

<div id="denied" class="denied" hidden>
  <h2>Not available</h2>
  <p id="deniedwhy"></p>
  <a class="ghost" href="/login.html">Sign in</a>
</div>

<!-- The same shape as the properties panel: a slim picker on the left, and
     the detail using every pixel to its right. A narrow panel pinned to the
     far edge left a band of nothing in the middle and made the eye travel
     the width of the screen to read one record. -->
<main id="app" hidden>
  <section class="picker" id="picker">
    <!-- One search box, moved rather than duplicated: the gallery view has
         no picker to sit in, and two inputs would be two pieces of state
         that can disagree. -->
    <div class="pickhead" id="pickhead">
      <div id="searchbox" class="searchbox">
        <input id="q" type="search" autocomplete="off" placeholder="Search…">
        <div class="pickmeta"><span id="count"></span><span id="headact"></span></div>
      </div>
    </div>
    <div class="plist" id="list"></div>
  </section>

  <section class="sheet" id="sheet">
    <div class="sheethead">
      <h1 id="title">…</h1>
      <span id="msg" class="msg" hidden></span>
    </div>
    <div id="detailbody" class="dbody">
      <p class="cempty" id="nothing">Choose one from the list.</p>
    </div>
  </section>
</main>

<script src="/crm.js"></script>
<script src="/nav.js"></script>
