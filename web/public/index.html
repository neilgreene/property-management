<!doctype html>
<meta charset="utf-8">
<title>SDI — Investment Property Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/app.css">

<header class="bar">
  <div class="brand"><span class="mark">SDI</span> <span class="brandtxt">Investment Property Marketplace</span></div>

  <form id="ask" class="ask" autocomplete="off">
    <span class="askicon">✦</span>
    <input id="asktext" placeholder="Ask in plain English — “3 bed duplex in Cleveland under 200k, best yield”">
    <button type="submit">Search</button>
  </form>

  <div class="who">
    <span id="whoami" class="chip">…</span>
    <button id="favtoggle" class="ghost" hidden>♥ Favourites <span id="favcount">0</span></button>
    <a id="signin" class="ghost" href="/login.html">Sign in</a>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </div>
</header>

<div id="parsed" class="parsed" hidden></div>

<nav class="filters">
  <label>Price
    <span class="pair">
      <input id="min_price" type="number" placeholder="min" step="5000">
      <i>–</i>
      <input id="max_price" type="number" placeholder="max" step="5000">
    </span>
  </label>
  <label>Beds <select id="min_beds"><option value="">Any</option></select></label>
  <label>Baths <select id="min_baths"><option value="">Any</option></select></label>
  <label>Sq ft
    <span class="pair">
      <input id="min_sqft" type="number" placeholder="min" step="100">
      <i>–</i>
      <input id="max_sqft" type="number" placeholder="max" step="100">
    </span>
  </label>
  <label>Type <select id="property_type"><option value="">Any</option></select></label>
  <label>City <select id="city"><option value="">Any</option></select></label>
  <label>Sort
    <select id="sort">
      <option value="ref">Listing ref</option>
      <option value="price_asc">Price: low to high</option>
      <option value="price_desc">Price: high to low</option>
      <option value="cap_desc">Cap rate</option>
      <option value="sqft_desc">Largest</option>
      <option value="beds_desc">Most bedrooms</option>
    </select>
  </label>
  <span class="spacer"></span>
  <select id="searchpicker" class="saved"><option value="">Saved searches…</option></select>
  <button id="savesearch" class="primary" hidden>Save search</button>
  <button id="reset" class="ghost">Reset</button>
</nav>

<p id="gate" class="gate"></p>

<main>
  <section id="mapwrap" class="mapwrap">
    <div id="map"></div>
    <div id="mapfallback" class="fallback" hidden></div>
    <div class="legend">
      <span><i class="dot exact"></i> exact location</span>
      <span><i class="dot approx"></i> approximate — address gated</span>
    </div>
  </section>

  <section class="results">
    <div class="resulthead">
      <h1 id="count">…</h1>
      <span id="scope" class="muted"></span>
    </div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<aside id="detail" class="detail" hidden>
  <button id="closedetail" class="close" aria-label="Close">×</button>
  <div id="detailbody"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/app.js"></script>
